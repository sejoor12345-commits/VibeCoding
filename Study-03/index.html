<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상식 퀴즈 게임</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card-bg: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .page {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 14px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* 시작 화면: 카테고리 선택 */
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 12px;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    .category-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
      transform: translateY(-2px);
    }

    .category-count {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    /* 퀴즈 화면 */
    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px 0;
    }

    .back-btn:hover {
      color: var(--text);
    }

    .progress-text {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
    }

    .category-tag {
      display: inline-block;
      background: #eef2ff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    .choice-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .choice-item.correct {
      background: #ecfdf3;
      border-color: #16a34a;
      color: #15803d;
      font-weight: 700;
    }

    .choice-item.wrong {
      background: #fef2f2;
      border-color: #dc2626;
      color: #b91c1c;
      font-weight: 700;
    }

    .choice-number {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice-item.correct .choice-number {
      background: #16a34a;
      color: #fff;
    }

    .choice-item.wrong .choice-number {
      background: #dc2626;
      color: #fff;
    }

    .quiz-footer {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .next-btn:hover {
      background: var(--primary-hover);
    }

    .next-btn:disabled {
      background: var(--muted);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* 결과 화면 */
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
    }

    .result-score {
      font-size: 44px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 8px;
    }

    .result-detail {
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 28px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .result-actions button {
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
    }

    .result-actions .retry-btn {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .result-actions .retry-btn:hover {
      background: var(--primary-hover);
    }

    /* 닉네임 입력 (최초 1회) */
    .nickname-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 0 0 24px;
      text-align: left;
    }

    .nickname-label {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .nickname-row {
      display: flex;
      gap: 8px;
    }

    .nickname-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
    }

    .nickname-save-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .nickname-save-btn:hover {
      background: var(--primary-hover);
    }

    /* 리더보드 화면 */
    .leaderboard-filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .leaderboard-filter-tabs button {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .leaderboard-filter-tabs button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
    }

    .lb-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .lb-rank {
      flex-shrink: 0;
      width: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .lb-name {
      flex: 1;
      font-weight: 700;
    }

    .lb-score {
      font-weight: 800;
    }

    .lb-bottom {
      display: flex;
      gap: 6px;
      padding-left: 30px;
      font-size: 12px;
      color: var(--muted);
    }

    .leaderboard-empty {
      text-align: center;
      color: var(--muted);
      padding: 20px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>상식 퀴즈 게임</h1>
    <p class="subtitle">카테고리를 골라서 문제를 풀어보세요</p>

    <!-- 시작 화면 -->
    <section id="screen-start" class="screen active">
      <div id="category-grid" class="category-grid"></div>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-header">
        <button type="button" id="back-btn" class="back-btn">← 카테고리 선택으로</button>
        <span id="progress-text" class="progress-text"></span>
      </div>

      <div class="quiz-card">
        <span id="category-tag" class="category-tag"></span>
        <p id="question-text" class="question-text"></p>
        <ul id="choice-list" class="choice-list"></ul>
      </div>

      <div class="quiz-footer">
        <button type="button" id="next-btn" class="next-btn" disabled>다음 문제</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <div class="result-card">
        <p id="result-score" class="result-score"></p>
        <p id="result-detail" class="result-detail"></p>

        <div id="nickname-section" class="nickname-section" hidden>
          <p class="nickname-label">기록을 남기려면 닉네임을 입력해주세요 (최초 1회만 입력하면 계속 저장돼요)</p>
          <div class="nickname-row">
            <input type="text" id="nickname-input" class="nickname-input" placeholder="닉네임" maxlength="10">
            <button type="button" id="nickname-save-btn" class="nickname-save-btn">저장</button>
          </div>
        </div>

        <div class="result-actions">
          <button type="button" id="leaderboard-btn">리더보드 보기</button>
          <button type="button" id="retry-btn" class="retry-btn">같은 카테고리 다시 풀기</button>
          <button type="button" id="result-back-btn">카테고리 선택으로</button>
        </div>
      </div>
    </section>

    <!-- 리더보드 화면 -->
    <section id="screen-leaderboard" class="screen">
      <div class="quiz-header">
        <button type="button" id="leaderboard-back-btn" class="back-btn">← 결과 화면으로</button>
        <span class="progress-text">리더보드</span>
      </div>

      <div id="leaderboard-filter-tabs" class="leaderboard-filter-tabs"></div>

      <div class="quiz-card">
        <ul id="leaderboard-list" class="leaderboard-list"></ul>
      </div>

      <div class="quiz-footer">
        <button type="button" id="leaderboard-retry-btn" class="next-btn">다시하기</button>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script>
    // 화면에 보여줄 카테고리 순서
    const CATEGORIES = ["한국사", "과학", "일반상식", "의학"];

    const AUTO_ADVANCE_MS = 1500;
    const POINTS_PER_QUESTION = 10;
    const LEADERBOARD_SIZE = 10;
    const STORAGE_KEYS = { nickname: "quiz:nickname", records: "quiz:records" };
    const LEADERBOARD_FILTERS = ["전체", ...CATEGORIES];

    const state = {
      category: null,
      list: [],
      index: 0,
      correctCount: 0,
      answered: false,
      autoAdvanceTimer: null,
      lastResult: null,
      leaderboardFilter: "전체",
    };

    const screenStart = document.getElementById("screen-start");
    const screenQuiz = document.getElementById("screen-quiz");
    const screenResult = document.getElementById("screen-result");
    const screenLeaderboard = document.getElementById("screen-leaderboard");
    const categoryGrid = document.getElementById("category-grid");
    const progressText = document.getElementById("progress-text");
    const categoryTag = document.getElementById("category-tag");
    const questionText = document.getElementById("question-text");
    const choiceList = document.getElementById("choice-list");
    const nextBtn = document.getElementById("next-btn");
    const backBtn = document.getElementById("back-btn");
    const resultScore = document.getElementById("result-score");
    const resultDetail = document.getElementById("result-detail");
    const retryBtn = document.getElementById("retry-btn");
    const resultBackBtn = document.getElementById("result-back-btn");
    const nicknameSection = document.getElementById("nickname-section");
    const nicknameInput = document.getElementById("nickname-input");
    const nicknameSaveBtn = document.getElementById("nickname-save-btn");
    const leaderboardBtn = document.getElementById("leaderboard-btn");
    const leaderboardFilterTabs = document.getElementById("leaderboard-filter-tabs");
    const leaderboardList = document.getElementById("leaderboard-list");
    const leaderboardBackBtn = document.getElementById("leaderboard-back-btn");
    const leaderboardRetryBtn = document.getElementById("leaderboard-retry-btn");

    function showScreen(name) {
      screenStart.classList.toggle("active", name === "start");
      screenQuiz.classList.toggle("active", name === "quiz");
      screenResult.classList.toggle("active", name === "result");
      screenLeaderboard.classList.toggle("active", name === "leaderboard");
    }

    // localStorage에 저장된 닉네임/기록을 읽고 쓰는 함수들.
    // 사지방 컴퓨터처럼 localStorage가 막혀 있을 수도 있어 try/catch로 감싼다.
    function getNickname() {
      try {
        return localStorage.getItem(STORAGE_KEYS.nickname);
      } catch (error) {
        return null;
      }
    }

    function setNickname(name) {
      try {
        localStorage.setItem(STORAGE_KEYS.nickname, name);
      } catch (error) {
        // 저장이 안 되더라도 이번 플레이는 계속 진행한다.
      }
    }

    function getRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.records);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveRecords(records) {
      try {
        localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(records));
      } catch (error) {
        // 저장 공간이 꽉 찼거나 막혀 있어도 이번 플레이 진행에는 영향 없음.
      }
    }

    // 같은 닉네임 + 같은 카테고리 기록은 하나만 남기고, 새 점수가 더 높을 때만 그 기록을 갱신한다.
    function recordResult(nickname, result) {
      const records = getRecords();
      const existingIndex = records.findIndex(
        (r) => r.nickname === nickname && r.category === result.category
      );
      const newRecord = {
        nickname,
        category: result.category,
        score: result.score,
        accuracy: result.accuracy,
        date: new Date().toISOString(),
      };

      if (existingIndex === -1) {
        records.push(newRecord);
      } else if (result.score > records[existingIndex].score) {
        records[existingIndex] = newRecord;
      }

      saveRecords(records);
    }

    function renderCategoryButtons() {
      categoryGrid.innerHTML = "";
      CATEGORIES.forEach((category) => {
        const count = questions.filter((q) => q.category === category).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-btn";
        btn.innerHTML = `${category}<span class="category-count">${count}문제</span>`;
        btn.addEventListener("click", () => startCategory(category));
        categoryGrid.appendChild(btn);
      });
    }

    function startCategory(category) {
      state.category = category;
      state.list = questions.filter((q) => q.category === category);
      state.index = 0;
      state.correctCount = 0;
      showScreen("quiz");
      renderQuestion();
    }

    function renderQuestion() {
      const total = state.list.length;
      const current = state.list[state.index];

      state.answered = false;
      clearTimeout(state.autoAdvanceTimer);

      progressText.textContent = `${state.index + 1} / ${total}`;
      categoryTag.textContent = current.category;
      questionText.textContent = current.question;

      choiceList.innerHTML = "";
      current.choices.forEach((choice, i) => {
        const li = document.createElement("li");
        li.className = "choice-item";
        li.innerHTML = `<span class="choice-number">${i + 1}</span><span>${choice}</span>`;
        li.addEventListener("click", () => selectChoice(i, current));
        choiceList.appendChild(li);
      });

      nextBtn.disabled = true;
      nextBtn.textContent = state.index === total - 1 ? "결과 보기" : "다음 문제";
    }

    function selectChoice(selectedIndex, current) {
      if (state.answered) return;
      state.answered = true;

      const choiceItems = choiceList.querySelectorAll(".choice-item");
      choiceItems[current.answerIndex].classList.add("correct");
      if (selectedIndex !== current.answerIndex) {
        choiceItems[selectedIndex].classList.add("wrong");
      } else {
        state.correctCount += 1;
      }

      nextBtn.disabled = false;
      state.autoAdvanceTimer = setTimeout(goNext, AUTO_ADVANCE_MS);
    }

    function goNext() {
      clearTimeout(state.autoAdvanceTimer);
      if (state.index < state.list.length - 1) {
        state.index += 1;
        renderQuestion();
      } else {
        renderResult();
        showScreen("result");
      }
    }

    function renderResult() {
      const total = state.list.length;
      const score = state.correctCount * POINTS_PER_QUESTION;
      const accuracy = Math.round((state.correctCount / total) * 100);
      state.lastResult = { category: state.category, score, accuracy };

      resultScore.textContent = `${score}점`;
      resultDetail.textContent =
        `${state.category} - ${total}문제 중 ${state.correctCount}개 정답 (정답률 ${accuracy}%)`;

      const nickname = getNickname();
      if (nickname) {
        nicknameSection.hidden = true;
        recordResult(nickname, state.lastResult);
      } else {
        nicknameSection.hidden = false;
        nicknameInput.value = "";
      }
    }

    function saveNickname() {
      const name = nicknameInput.value.trim();
      if (!name) {
        nicknameInput.focus();
        return;
      }
      setNickname(name);
      nicknameSection.hidden = true;
      recordResult(name, state.lastResult);
    }

    function renderLeaderboardFilterTabs() {
      leaderboardFilterTabs.innerHTML = "";
      LEADERBOARD_FILTERS.forEach((filter) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = filter;
        btn.dataset.filter = filter;
        btn.addEventListener("click", () => renderLeaderboard(filter));
        leaderboardFilterTabs.appendChild(btn);
      });
    }

    function renderLeaderboard(filter) {
      state.leaderboardFilter = filter;

      leaderboardFilterTabs.querySelectorAll("button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });

      const records = getRecords();
      const filtered = filter === "전체" ? records : records.filter((r) => r.category === filter);
      const top = [...filtered].sort((a, b) => b.score - a.score).slice(0, LEADERBOARD_SIZE);

      leaderboardList.innerHTML = "";
      if (top.length === 0) {
        const empty = document.createElement("li");
        empty.className = "leaderboard-empty";
        empty.textContent = "아직 기록이 없어요";
        leaderboardList.appendChild(empty);
        return;
      }

      top.forEach((record, i) => {
        const li = document.createElement("li");
        li.className = "leaderboard-item";

        const topRow = document.createElement("div");
        topRow.className = "lb-top";
        const rank = document.createElement("span");
        rank.className = "lb-rank";
        rank.textContent = i + 1;
        const name = document.createElement("span");
        name.className = "lb-name";
        name.textContent = record.nickname;
        const score = document.createElement("span");
        score.className = "lb-score";
        score.textContent = `${record.score}점`;
        topRow.append(rank, name, score);

        const bottomRow = document.createElement("div");
        bottomRow.className = "lb-bottom";
        const category = document.createElement("span");
        category.textContent = record.category;
        const accuracy = document.createElement("span");
        accuracy.textContent = `정답률 ${record.accuracy}%`;
        const date = document.createElement("span");
        date.textContent = record.date.slice(0, 10);
        bottomRow.append(category, accuracy, date);

        li.append(topRow, bottomRow);
        leaderboardList.appendChild(li);
      });
    }

    nextBtn.addEventListener("click", goNext);
    backBtn.addEventListener("click", () => {
      clearTimeout(state.autoAdvanceTimer);
      showScreen("start");
    });
    retryBtn.addEventListener("click", () => startCategory(state.category));
    resultBackBtn.addEventListener("click", () => showScreen("start"));
    nicknameSaveBtn.addEventListener("click", saveNickname);
    nicknameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") saveNickname();
    });
    leaderboardBtn.addEventListener("click", () => {
      renderLeaderboard(state.leaderboardFilter);
      showScreen("leaderboard");
    });
    leaderboardBackBtn.addEventListener("click", () => showScreen("result"));
    leaderboardRetryBtn.addEventListener("click", () => showScreen("start"));

    renderCategoryButtons();
    renderLeaderboardFilterTabs();
  </script>
</body>
</html>
