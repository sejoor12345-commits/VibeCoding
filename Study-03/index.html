<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상식 퀴즈 게임</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%A0</text></svg>">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #f4f5fb;
      --card-bg: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-2: #7c3aed;
      --accent: #ec4899;
      --primary-hover: #4338ca;
      --border: #e6e7f0;

      --tag-cat-bg: #eef2ff;
      --tag-cat-text: #4f46e5;
      --tag-diff-bg: #fff7ed;
      --tag-diff-text: #c2410c;

      --correct-bg: #ecfdf3;
      --correct-border: #16a34a;
      --correct-text: #15803d;
      --wrong-bg: #fef2f2;
      --wrong-border: #dc2626;
      --wrong-text: #b91c1c;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;

      --shadow-sm: 0 2px 8px rgba(31, 36, 48, 0.06);
      --shadow-md: 0 10px 24px rgba(79, 70, 229, 0.14);
      --shadow-lg: 0 20px 44px rgba(79, 70, 229, 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10111a;
        --card-bg: #1a1c28;
        --text: #e9eaf3;
        --muted: #9599ab;
        --primary: #818cf8;
        --primary-2: #a78bfa;
        --accent: #f472b6;
        --primary-hover: #6366f1;
        --border: #2b2e3d;

        --tag-cat-bg: rgba(129, 140, 248, 0.16);
        --tag-cat-text: #b4bcfb;
        --tag-diff-bg: rgba(251, 146, 60, 0.16);
        --tag-diff-text: #fdba74;

        --correct-bg: rgba(34, 197, 94, 0.16);
        --correct-border: #22c55e;
        --correct-text: #6ee7a3;
        --wrong-bg: rgba(239, 68, 68, 0.16);
        --wrong-border: #ef4444;
        --wrong-text: #fca5a5;

        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 22px 48px rgba(0, 0, 0, 0.55);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(79, 70, 229, 0.14), transparent 60%),
        radial-gradient(700px 420px at 108% 6%, rgba(236, 72, 153, 0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px 56px;
    }

    .page {
      width: 100%;
      max-width: 480px;
    }

    /* 히어로 헤더 */
    .hero {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 34px 20px 30px;
      margin-bottom: 26px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 55%, var(--accent) 100%);
      box-shadow: var(--shadow-lg);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
    }

    .hero::before {
      width: 160px;
      height: 160px;
      top: -70px;
      left: -50px;
    }

    .hero::after {
      width: 120px;
      height: 120px;
      bottom: -60px;
      right: -30px;
    }

    .hero-icon {
      position: relative;
      display: block;
      font-size: 38px;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.18));
    }

    .hero h1 {
      position: relative;
      margin: 0 0 6px;
      font-size: 25px;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .hero .subtitle {
      position: relative;
      margin: 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: screenIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 모드 선택 화면 */
    .mode-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-btn {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .mode-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }

    .mode-btn:hover::before {
      opacity: 0.06;
    }

    .mode-icon {
      position: relative;
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--tag-cat-bg);
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mode-body {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mode-label {
      font-size: 16px;
      font-weight: 800;
    }

    .mode-desc {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted);
    }

    .mode-arrow {
      position: relative;
      color: var(--muted);
      font-size: 18px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .mode-btn:hover .mode-arrow {
      transform: translateX(4px);
      color: var(--primary);
    }

    /* 시작 화면: 카테고리 선택 */
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category-btn,
    .difficulty-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .category-btn:hover,
    .difficulty-btn:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-3px) scale(1.02);
    }

    .btn-icon-lg {
      font-size: 28px;
      line-height: 1;
    }

    .btn-label {
      font-size: 16px;
      font-weight: 700;
    }

    .category-count {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    /* 난이도 선택 화면 */
    .difficulty-title {
      text-align: center;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .difficulty-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .difficulty-desc {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    /* 공통 상단 헤더 (뒤로가기 / 진행률) */
    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s;
    }

    .back-btn:hover {
      color: var(--primary);
    }

    .progress-track {
      flex: 1;
      height: 8px;
      margin: 0 12px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: width 0.35s ease;
    }

    .progress-text {
      flex-shrink: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
    }

    .category-tag,
    .difficulty-tag {
      display: inline-block;
      background: var(--tag-cat-bg);
      color: var(--tag-cat-text);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
      margin-right: 6px;
    }

    .difficulty-tag {
      background: var(--tag-diff-bg);
      color: var(--tag-diff-text);
    }

    .speed-timer {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 14px;
      transition: color 0.2s ease;
    }

    .speed-timer.low {
      color: var(--wrong-border);
      animation: pulse 0.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .question-text {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    .choice-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
    }

    .choice-item:hover:not(.correct):not(.wrong) {
      border-color: var(--primary);
      background: var(--tag-cat-bg);
      transform: translateX(2px);
    }

    .choice-item.correct,
    .choice-item.wrong {
      animation: choicePop 0.3s ease;
    }

    @keyframes choicePop {
      0% { transform: scale(0.97); }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .choice-item.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .choice-item.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 700;
    }

    .choice-number {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice-item.correct .choice-number {
      background: var(--correct-border);
      color: #fff;
    }

    .choice-item.wrong .choice-number {
      background: var(--wrong-border);
      color: #fff;
    }

    .answer-banner {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 16px;
      text-align: center;
      animation: bannerIn 0.3s ease;
    }

    @keyframes bannerIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .answer-banner.correct {
      background: var(--correct-border);
      color: #fff;
    }

    .answer-banner.wrong {
      background: var(--wrong-border);
      color: #fff;
    }

    .explanation-text {
      margin: 12px 0 0;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
    }

    .choice-item.hint-hidden {
      display: none;
    }

    .hint-btn {
      margin-top: 14px;
      background: none;
      border: 1px dashed var(--primary);
      color: var(--primary);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .hint-btn:hover {
      background: var(--tag-cat-bg);
    }

    .hint-btn:disabled {
      border-color: var(--border);
      color: var(--muted);
      cursor: not-allowed;
      background: none;
    }

    .quiz-footer {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    .next-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .next-btn:disabled {
      background: var(--muted);
      cursor: not-allowed;
      opacity: 0.55;
      box-shadow: none;
    }

    /* 결과 화면 */
    .result-card {
      position: relative;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 38px 20px 32px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .result-card::before {
      content: "";
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.16), transparent 70%);
    }

    .result-icon {
      position: relative;
      font-size: 46px;
      margin: 0 0 4px;
    }

    .result-score {
      position: relative;
      font-size: 44px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 8px;
    }

    .result-detail {
      position: relative;
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 8px;
    }

    .result-stats {
      position: relative;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 28px;
    }

    .result-actions {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .result-actions button {
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .result-actions button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .result-actions .retry-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
      color: #fff;
    }

    /* 닉네임 입력 (매 플레이마다) */
    .nickname-section {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin: 0 0 24px;
      text-align: left;
    }

    .nickname-label {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .nickname-row {
      display: flex;
      gap: 8px;
    }

    .nickname-input {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
    }

    .nickname-save-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .nickname-save-btn:disabled {
      background: var(--muted);
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* 리더보드 화면 */
    .leaderboard-filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .leaderboard-filter-tabs button {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .leaderboard-filter-tabs button.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
      color: #fff;
    }

    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      transition: transform 0.15s;
    }

    .leaderboard-item.rank-gold {
      border-color: #eab308;
      background: linear-gradient(90deg, rgba(234, 179, 8, 0.1), transparent);
    }

    .leaderboard-item.rank-silver {
      border-color: #94a3b8;
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.1), transparent);
    }

    .leaderboard-item.rank-bronze {
      border-color: #c2703a;
      background: linear-gradient(90deg, rgba(194, 112, 58, 0.1), transparent);
    }

    .lb-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .lb-rank {
      flex-shrink: 0;
      width: 22px;
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
    }

    .lb-name {
      flex: 1;
      font-weight: 700;
    }

    .lb-score {
      font-weight: 800;
    }

    .lb-bottom {
      display: flex;
      gap: 6px;
      padding-left: 32px;
      font-size: 12px;
      color: var(--muted);
    }

    .leaderboard-empty {
      text-align: center;
      color: var(--muted);
      padding: 20px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <span class="hero-icon">🧠</span>
      <h1>상식 퀴즈 게임</h1>
      <p class="subtitle">모드를 고르고 문제를 풀어보세요</p>
    </header>

    <!-- 모드 선택 화면 -->
    <section id="screen-mode" class="screen active">
      <div id="mode-grid" class="mode-grid"></div>
    </section>

    <!-- 시작 화면: 카테고리 선택 (카테고리별 모드에서만 사용) -->
    <section id="screen-start" class="screen">
      <div class="quiz-header">
        <button type="button" id="start-back-btn" class="back-btn">← 모드 선택으로</button>
      </div>
      <div id="category-grid" class="category-grid"></div>
    </section>

    <!-- 난이도 선택 화면 -->
    <section id="screen-difficulty" class="screen">
      <div class="quiz-header">
        <button type="button" id="difficulty-back-btn" class="back-btn">← 뒤로</button>
      </div>
      <p id="difficulty-title" class="difficulty-title"></p>
      <div id="difficulty-grid" class="difficulty-grid"></div>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-header">
        <button type="button" id="back-btn" class="back-btn">← 처음으로</button>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="progress-text"></span>
      </div>

      <div class="quiz-card">
        <div id="speed-timer" class="speed-timer" hidden></div>
        <span id="category-tag" class="category-tag"></span>
        <span id="difficulty-tag" class="difficulty-tag"></span>
        <p id="question-text" class="question-text"></p>
        <ul id="choice-list" class="choice-list"></ul>
        <button type="button" id="hint-btn" class="hint-btn" hidden>💡 힌트 보기 (오답 하나 제거, 보너스 3점 사라짐)</button>

        <div id="nickname-section" class="nickname-section">
          <p class="nickname-label">닉네임을 입력하면 기록이 저장돼요 (같은 닉네임+모드+난이도면 최고 점수만 남아요)</p>

    <!-- 리더보드 화면 -->
    <section id="screen-leaderboard" class="screen">
      <div class="quiz-header">
        <button type="button" id="leaderboard-back-btn" class="back-btn">← 결과 화면으로</button>
        <span class="progress-text">🏆 리더보드</span>
      </div>

      <div id="leaderboard-filter-tabs" class="leaderboard-filter-tabs"></div>

      <div class="quiz-card">
        <ul id="leaderboard-list" class="leaderboard-list"></ul>

  </main>

  <script src="questions.js"></script>
  <script>
    // 화면에 보여줄 카테고리 순서
    const CATEGORIES = ["한국사", "과학", "일반상식", "의학"];

    // 카테고리/난이도/모드마다 화면에 보여줄 이모지 아이콘 (꾸밈 용도일 뿐, 게임 로직과는 무관)
    const CATEGORY_ICONS = { 한국사: "🏯", 과학: "🔬", 일반상식: "💡", 의학: "⚕️" };
    const DIFFICULTY_ICONS = { 하: "🌱", 중: "📘", 상: "🎓", 최상: "🏆" };
    const MODE_ICONS = { category: "📚", all: "🔥", speed: "⚡" };

    // 난이도: 하=초등학생, 중=고등학생, 상=대학생, 최상=그 분야를 공부하는 사람 수준
    const DIFFICULTIES = [
      { key: "하", desc: "초등학생 수준" },
      { key: "중", desc: "고등학생 수준" },
      { key: "상", desc: "대학생 수준" },
      { key: "최상", desc: "그 분야를 공부하는 사람 수준" },
    ];

    // 게임 모드: category(카테고리별 10문제), all(전체 도전 40문제), speed(스피드 퀴즈 20문제)
    const MODES = [
      { key: "category", label: "카테고리별", desc: "원하는 카테고리 1개 · 10문제" },
      { key: "all", label: "전체 도전", desc: "4개 카테고리 전부 · 40문제 (무작위 순서)" },
      { key: "speed", label: "스피드 퀴즈", desc: "카테고리 무작위 20문제 · 문제당 15초" },
    ];

    const AUTO_ADVANCE_MS = 2500;
    const BASE_SCORE = 10;
    // 난이도 배수: 상위 난이도일수록 문제당 기본 점수가 더 높다.
    const DIFFICULTY_MULTIPLIER = { 하: 1.0, 중: 1.2, 상: 1.5, 최상: 2.0 };
    const DEFAULT_TIME_LIMIT_SECONDS = 10; // 문제에 timeLimit이 없을 때 쓰는 기본 제한시간
    const SPEED_TIME_LIMIT_SECONDS = 15; // 스피드 퀴즈는 문제마다 이 시간이 강제 제한시간
    const SPEED_QUESTION_COUNT = 20;
    const TIME_BONUS_POINTS = 5;
    const HINT_BONUS_POINTS = 3;
    const COMBO_STREAK = 3; // 연속 정답이 이 배수에 도달할 때마다 콤보 보너스
    const COMBO_BONUS_POINTS = 5;
    const LEADERBOARD_SIZE = 10;
    const STORAGE_KEYS = { lastNickname: "quiz:lastNickname", records: "quiz:records" };
    // "모두"는 모드 구분 없이 전체 기록을 보는 메타 필터라서, "전체 도전" 모드 이름과 겹치지 않게 따로 둔다.
    const LEADERBOARD_FILTERS = ["모두", "전체", ...CATEGORIES, "스피드"];

    const state = {
      mode: null, // "category" | "all" | "speed"
      category: null,
      difficulty: null,
      list: [],
      index: 0,
      correctCount: 0,
      answered: false,
      autoAdvanceTimer: null,
      speedTimerInterval: null,
      lastResult: null,
      leaderboardFilter: "모두",
      totalScore: 0,
      combo: 0,
      maxCombo: 0,
      hintsUsedCount: 0,
      hintUsedThisQuestion: false,
      questionStartTime: 0,
    };

    const screenMode = document.getElementById("screen-mode");
    const screenStart = document.getElementById("screen-start");
    const screenDifficulty = document.getElementById("screen-difficulty");
    const screenQuiz = document.getElementById("screen-quiz");
    const screenResult = document.getElementById("screen-result");
    const screenLeaderboard = document.getElementById("screen-leaderboard");
    const modeGrid = document.getElementById("mode-grid");
    const startBackBtn = document.getElementById("start-back-btn");
    const categoryGrid = document.getElementById("category-grid");
    const difficultyTitle = document.getElementById("difficulty-title");
    const difficultyGrid = document.getElementById("difficulty-grid");
    const difficultyBackBtn = document.getElementById("difficulty-back-btn");
    const progressText = document.getElementById("progress-text");
    const progressFill = document.getElementById("progress-fill");
    const speedTimer = document.getElementById("speed-timer");
    const categoryTag = document.getElementById("category-tag");
    const difficultyTag = document.getElementById("difficulty-tag");
    const questionText = document.getElementById("question-text");
    const choiceList = document.getElementById("choice-list");
    const hintBtn = document.getElementById("hint-btn");
    const answerBanner = document.getElementById("answer-banner");
    const explanationText = document.getElementById("explanation-text");
    const nextBtn = document.getElementById("next-btn");
    const backBtn = document.getElementById("back-btn");
    const resultIcon = document.getElementById("result-icon");
    const resultScore = document.getElementById("result-score");
    const resultDetail = document.getElementById("result-detail");
    const resultStats = document.getElementById("result-stats");
    const retryBtn = document.getElementById("retry-btn");
    const resultBackBtn = document.getElementById("result-back-btn");
    const nicknameSection = document.getElementById("nickname-section");
    const nicknameInput = document.getElementById("nickname-input");
    const nicknameSaveBtn = document.getElementById("nickname-save-btn");
    const leaderboardBtn = document.getElementById("leaderboard-btn");
    const leaderboardFilterTabs = document.getElementById("leaderboard-filter-tabs");
    const leaderboardList = document.getElementById("leaderboard-list");
    const leaderboardBackBtn = document.getElementById("leaderboard-back-btn");
    const leaderboardRetryBtn = document.getElementById("leaderboard-retry-btn");

    function showScreen(name) {
      screenMode.classList.toggle("active", name === "mode");
      screenStart.classList.toggle("active", name === "start");
      screenDifficulty.classList.toggle("active", name === "difficulty");
      screenQuiz.classList.toggle("active", name === "quiz");
      screenResult.classList.toggle("active", name === "result");
      screenLeaderboard.classList.toggle("active", name === "leaderboard");
    }

    // Fisher-Yates 셔플. 원본 배열은 건드리지 않고 새 배열을 반환한다.
    function shuffle(array) {
      const result = array.slice();
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // localStorage에 저장된 마지막 닉네임(입력창에 미리 채워주는 용도)/기록을 읽고 쓰는 함수들.
    // 사지방 컴퓨터처럼 localStorage가 막혀 있을 수도 있어 try/catch로 감싼다.
    function getLastNickname() {
      try {
        return localStorage.getItem(STORAGE_KEYS.lastNickname);
      } catch (error) {
        return null;
      }
    }

    function setLastNickname(name) {
      try {
        localStorage.setItem(STORAGE_KEYS.lastNickname, name);
      } catch (error) {
        // 저장이 안 되더라도 이번 플레이는 계속 진행한다.
      }
    }

    function getRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.records);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveRecords(records) {
      try {
        localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(records));
      } catch (error) {
        // 저장 공간이 꽉 찼거나 막혀 있어도 이번 플레이 진행에는 영향 없음.
      }
    }

    // 같은 닉네임 + 같은 모드 + 같은 난이도 기록은 하나만 남기고, 새 점수가 더 높을 때만 그 기록을 갱신한다.
    // mode 값은 "전체"(전체 도전), 카테고리명(카테고리별), "스피드"(스피드 퀴즈) 중 하나.
    // 스피드 퀴즈는 문제마다 난이도가 섞이므로 difficulty는 항상 null.
    function recordResult(nickname, result) {
      const records = getRecords();
      const existingIndex = records.findIndex(
        (r) => r.nickname === nickname && r.mode === result.mode && r.difficulty === result.difficulty
      );
      const newRecord = {
        nickname,
        mode: result.mode,
        difficulty: result.difficulty,
        score: result.score,
        accuracy: result.accuracy,
        date: new Date().toISOString(),
      };

      if (existingIndex === -1) {
        records.push(newRecord);
      } else if (result.score > records[existingIndex].score) {
        records[existingIndex] = newRecord;
      }

      saveRecords(records);
    }

    function renderModeButtons() {
      modeGrid.innerHTML = "";
      MODES.forEach(({ key, label, desc }) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mode-btn";
        btn.innerHTML =
          `<span class="mode-icon">${MODE_ICONS[key]}</span>` +
          `<span class="mode-body"><span class="mode-label">${label}</span>` +
          `<span class="mode-desc">${desc}</span></span>` +
          `<span class="mode-arrow">›</span>`;
        btn.addEventListener("click", () => selectMode(key));
        modeGrid.appendChild(btn);
      });
    }

    function selectMode(mode) {
      state.mode = mode;
      if (mode === "category") {
        showScreen("start");
      } else if (mode === "all") {
        state.category = null;
        goToDifficultyScreen();
      } else {
        startSpeedQuiz();
      }
    }

    function renderCategoryButtons() {
      categoryGrid.innerHTML = "";
      CATEGORIES.forEach((category) => {
        const count = questions.filter((q) => q.category === category).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-btn";
        btn.innerHTML =
          `<span class="btn-icon-lg">${CATEGORY_ICONS[category]}</span>` +
          `<span class="btn-label">${category}</span>` +
          `<span class="category-count">${count}문제</span>`;
        btn.addEventListener("click", () => {
          state.category = category;
          goToDifficultyScreen();
        });
        categoryGrid.appendChild(btn);
      });
    }

    // 카테고리별 모드에서는 state.category가 채워진 채로, 전체 도전 모드에서는 카테고리 없이 호출된다.
    function goToDifficultyScreen() {
      const isAllChallenge = state.mode === "all";
      difficultyTitle.textContent = isAllChallenge
        ? "전체 도전 - 난이도를 선택하세요"
        : `${state.category} - 난이도를 선택하세요`;

      difficultyGrid.innerHTML = "";
      DIFFICULTIES.forEach(({ key, desc }) => {
        const count = isAllChallenge
          ? questions.filter((q) => q.difficulty === key).length
          : questions.filter((q) => q.category === state.category && q.difficulty === key).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "difficulty-btn";
        btn.innerHTML =
          `<span class="btn-icon-lg">${DIFFICULTY_ICONS[key]}</span>` +
          `<span class="btn-label">${key}</span>` +
          `<span class="difficulty-desc">${desc}</span>` +
          `<span class="category-count">${count}문제</span>`;
        btn.addEventListener("click", () => {
          if (isAllChallenge) startAllChallengeQuiz(key);
          else startCategoryQuiz(state.category, key);
        });
        difficultyGrid.appendChild(btn);
      });

      showScreen("difficulty");
    }

    // 전체 도전: 4개 카테고리를 각각 10문제씩 모아 무작위로 섞는다.
    // 순차 배치(카테고리별로 10문제씩 묶어서 진행)도 가능하지만, 그러면 "카테고리별 모드 x4"를 이어붙인 것과
    // 다를 게 없어져서 전체 도전만의 특징이 사라진다. 카테고리를 예측할 수 없게 섞어야 콤보/집중력 도전이라는
    // 모드 취지에 맞고, 매번 다른 순서로 플레이되니 재도전 재미도 커진다. 그래서 무작위 셔플을 기본으로 한다.
    function buildAllChallengeList(difficulty) {
      const combined = CATEGORIES.flatMap((category) =>
        questions.filter((q) => q.category === category && q.difficulty === difficulty)
      );
      return shuffle(combined);
    }

    // 스피드 퀴즈: 카테고리/난이도 구분 없이 전체 문제 풀에서 무작위로 20문제를 뽑는다.
    function buildSpeedList() {
      return shuffle(questions).slice(0, SPEED_QUESTION_COUNT);
    }

    function beginQuiz(list) {
      state.list = list;
      state.index = 0;
      state.correctCount = 0;
      state.totalScore = 0;
      state.combo = 0;
      state.maxCombo = 0;
      state.hintsUsedCount = 0;
      showScreen("quiz");
      renderQuestion();
    }

    function startCategoryQuiz(category, difficulty) {
      state.mode = "category";
      state.category = category;
      state.difficulty = difficulty;
      beginQuiz(questions.filter((q) => q.category === category && q.difficulty === difficulty));
    }

    function startAllChallengeQuiz(difficulty) {
      state.mode = "all";
      state.category = null;
      state.difficulty = difficulty;
      beginQuiz(buildAllChallengeList(difficulty));
    }

    function startSpeedQuiz() {
      state.mode = "speed";
      state.category = null;
      state.difficulty = null;
      beginQuiz(buildSpeedList());
    }

    function retryCurrentMode() {
      if (state.mode === "category") startCategoryQuiz(state.category, state.difficulty);
      else if (state.mode === "all") startAllChallengeQuiz(state.difficulty);
      else startSpeedQuiz();
    }

    // 스피드 퀴즈는 문제마다 고정 15초, 나머지 모드는 문제별 timeLimit(없으면 기본 10초)을 쓴다.
    function getEffectiveTimeLimitSeconds(current) {
      if (state.mode === "speed") return SPEED_TIME_LIMIT_SECONDS;
      return current.timeLimit || DEFAULT_TIME_LIMIT_SECONDS;
    }

    function renderQuestion() {
      const total = state.list.length;
      const current = state.list[state.index];

      state.answered = false;
      state.hintUsedThisQuestion = false;
      state.questionStartTime = Date.now();
      clearTimeout(state.autoAdvanceTimer);
      clearInterval(state.speedTimerInterval);

      progressText.textContent = `${state.index + 1} / ${total}`;
      progressFill.style.width = `${Math.round(((state.index + 1) / total) * 100)}%`;
      categoryTag.textContent = `${CATEGORY_ICONS[current.category] || ""} ${current.category}`;
      difficultyTag.textContent =
        `${DIFFICULTY_ICONS[current.difficulty] || ""} 난이도: ${current.difficulty} (x${DIFFICULTY_MULTIPLIER[current.difficulty]})`;
      questionText.textContent = current.question;

      choiceList.innerHTML = "";
      current.choices.forEach((choice, i) => {
        const li = document.createElement("li");
        li.className = "choice-item";
        li.innerHTML = `<span class="choice-number">${i + 1}</span><span>${choice}</span>`;
        li.addEventListener("click", () => selectChoice(i, current));
        choiceList.appendChild(li);
      });

      hintBtn.hidden = !current.hasHint;
      hintBtn.disabled = false;
      hintBtn.textContent = "💡 힌트 보기 (오답 하나 제거, 보너스 3점 사라짐)";

      answerBanner.hidden = true;
      explanationText.hidden = true;
      nextBtn.disabled = true;
      nextBtn.textContent = state.index === total - 1 ? "결과 보기" : "다음 문제";

      if (state.mode === "speed") {
        speedTimer.hidden = false;
        startSpeedCountdown(current);
      } else {
        speedTimer.hidden = true;
      }
    }

    // 스피드 퀴즈 전용: 15초 카운트다운을 화면에 크게 표시하고, 0초가 되면 자동으로 오답 처리한다.
    function startSpeedCountdown(current) {
      const limitMs = SPEED_TIME_LIMIT_SECONDS * 1000;

      function tick() {
        const remainingMs = limitMs - (Date.now() - state.questionStartTime);
        const remainingSeconds = Math.max(0, Math.ceil(remainingMs / 1000));
        speedTimer.textContent = `⏱ ${remainingSeconds}초`;
        speedTimer.classList.toggle("low", remainingSeconds <= 5);

        if (remainingMs <= 0) {
          clearInterval(state.speedTimerInterval);
          handleTimeout(current);
        }
      }

      tick();
      state.speedTimerInterval = setInterval(tick, 200);
    }

    function useHint(current) {
      if (state.answered || state.hintUsedThisQuestion) return;

      const choiceItems = choiceList.querySelectorAll(".choice-item");
      for (let i = 0; i < current.choices.length; i++) {
        if (i !== current.answerIndex && !choiceItems[i].classList.contains("hint-hidden")) {
          choiceItems[i].classList.add("hint-hidden");
          break;
        }
      }

      state.hintUsedThisQuestion = true;
      state.hintsUsedCount += 1;
      hintBtn.disabled = true;
      hintBtn.textContent = "✅ 힌트 사용함";
    }

    // 문제 하나의 점수 = 기본점수(10) x 난이도 배수 + 시간보너스 + 힌트미사용보너스 + 콤보보너스. 오답은 0점.
    function calculateQuestionScore(current, isCorrect) {
      if (!isCorrect) {
        state.combo = 0;
        return { questionScore: 0, timeBonus: 0, hintBonus: 0, comboBonus: 0 };
      }

      state.combo += 1;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;

      const elapsedMs = Date.now() - state.questionStartTime;
      const timeLimitMs = getEffectiveTimeLimitSeconds(current) * 1000;
      const timeBonus = elapsedMs <= timeLimitMs / 2 ? TIME_BONUS_POINTS : 0;

      const hintBonus = current.hasHint && !state.hintUsedThisQuestion ? HINT_BONUS_POINTS : 0;

      const comboBonus = state.combo % COMBO_STREAK === 0 ? COMBO_BONUS_POINTS : 0;

      const base = BASE_SCORE * DIFFICULTY_MULTIPLIER[current.difficulty];
      const questionScore = base + timeBonus + hintBonus + comboBonus;

      return { questionScore, timeBonus, hintBonus, comboBonus, base, elapsedMs, timeLimitMs };
    }

    function selectChoice(selectedIndex, current) {
      if (state.answered) return;
      answerQuestion(current, selectedIndex);
    }

    // 스피드 퀴즈에서 15초 카운트다운이 0에 도달했는데 아직 답하지 않았을 때 호출된다.
    function handleTimeout(current) {
      if (state.answered) return;
      answerQuestion(current, null);
    }

    // selectedIndex가 null이면 "시간 초과로 답을 못 골랐다"는 뜻 — 오답과 동일하게 채점하되
    // 어떤 보기도 오답으로 표시하지 않는다(고른 게 없으니까).
    function answerQuestion(current, selectedIndex) {
      state.answered = true;
      clearInterval(state.speedTimerInterval);

      const isTimeout = selectedIndex === null;
      const isCorrect = !isTimeout && selectedIndex === current.answerIndex;
      const choiceItems = choiceList.querySelectorAll(".choice-item");
      choiceItems[current.answerIndex].classList.add("correct");
      if (isCorrect) {
        state.correctCount += 1;
      } else if (!isTimeout) {
        choiceItems[selectedIndex].classList.add("wrong");
      }

      const result = calculateQuestionScore(current, isCorrect);
      state.totalScore += result.questionScore;

      console.log(
        `[문제 ${state.index + 1}] 정답=${isCorrect} ${isTimeout ? "(시간 초과) " : ""}` +
          `난이도=${current.difficulty}(x${DIFFICULTY_MULTIPLIER[current.difficulty]}) ` +
          `기본점수=${result.base ?? 0} 시간보너스=${result.timeBonus} 힌트보너스=${result.hintBonus} ` +
          `콤보보너스=${result.comboBonus} 이번문제점수=${result.questionScore} ` +
          `콤보=${state.combo} 누적점수=${state.totalScore}`
      );

      hintBtn.disabled = true;

      if (isTimeout) {
        answerBanner.textContent = "⏰ 시간 초과! 오답으로 처리돼요";
      } else {
        answerBanner.textContent = isCorrect ? "✅ 정답입니다!" : "❌ 오답입니다!";
      }
      answerBanner.className = `answer-banner ${isCorrect ? "correct" : "wrong"}`;
      answerBanner.hidden = false;

      explanationText.textContent = current.explanation;
      explanationText.hidden = false;

      nextBtn.disabled = false;
      state.autoAdvanceTimer = setTimeout(goNext, AUTO_ADVANCE_MS);
    }

    function goNext() {
      clearTimeout(state.autoAdvanceTimer);
      if (state.index < state.list.length - 1) {
        state.index += 1;
        renderQuestion();
      } else {
        renderResult();
        showScreen("result");
      }
    }

    // 리더보드/기록에 저장할 mode 값: 전체 도전="전체", 카테고리별=카테고리명, 스피드 퀴즈="스피드".
    function getRecordModeValue() {
      if (state.mode === "category") return state.category;
      if (state.mode === "all") return "전체";
      return "스피드";
    }

    // 스피드 퀴즈는 문제마다 난이도가 섞이므로 기록에는 난이도를 남기지 않는다.
    function getRecordDifficultyValue() {
      return state.mode === "speed" ? null : state.difficulty;
    }

    function getResultTitle() {
      if (state.mode === "category") return `${state.category} (${state.difficulty})`;
      if (state.mode === "all") return `전체 도전 (${state.difficulty})`;
      return "스피드 퀴즈";
    }

    // 정답률에 따라 결과 화면 맨 위에 보여줄 이모지를 고른다 (순전히 장식용).
    function getResultTierIcon(accuracy) {
      if (accuracy >= 90) return "🏆";
      if (accuracy >= 70) return "👍";
      if (accuracy >= 50) return "🙂";
      return "💪";
    }

    function renderResult() {
      const total = state.list.length;
      const score = state.totalScore;
      const accuracy = Math.round((state.correctCount / total) * 100);
      state.lastResult = {
        mode: getRecordModeValue(),
        difficulty: getRecordDifficultyValue(),
        score,
        accuracy,
      };

      resultIcon.textContent = getResultTierIcon(accuracy);
      resultScore.textContent = `${score}점`;
      resultDetail.textContent =
        `${getResultTitle()} - ${total}문제 중 ${state.correctCount}개 정답 (정답률 ${accuracy}%)`;
      resultStats.textContent = `🔥 최고 콤보 ${state.maxCombo}연속 · 💡 사용한 힌트 ${state.hintsUsedCount}개`;

      retryBtn.textContent =
        state.mode === "category" ? "같은 카테고리 다시 풀기" :
        state.mode === "all" ? "같은 난이도로 다시 풀기" :
        "다시 도전하기";

      // 같은 PC를 여러 명이 쓸 수 있으니, 끝날 때마다 닉네임을 다시 입력받는다.
      nicknameInput.value = getLastNickname() || "";
      nicknameSaveBtn.textContent = "저장";
      nicknameSaveBtn.disabled = false;
      nicknameSection.hidden = false;
    }

    function saveNickname() {
      const name = nicknameInput.value.trim();
      if (!name) {
        nicknameInput.focus();
        return;
      }
      setLastNickname(name);
      recordResult(name, state.lastResult);
      nicknameInput.value = "";
      nicknameSaveBtn.textContent = "저장됨";
      nicknameSaveBtn.disabled = true;
    }

    function renderLeaderboardFilterTabs() {
      leaderboardFilterTabs.innerHTML = "";
      LEADERBOARD_FILTERS.forEach((filter) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = filter;
        btn.dataset.filter = filter;
        btn.addEventListener("click", () => renderLeaderboard(filter));
        leaderboardFilterTabs.appendChild(btn);
      });
    }

    // 상위 3등은 순위 숫자 대신 메달 이모지로 보여준다.
    function getRankDisplay(rankIndex) {
      if (rankIndex === 0) return { text: "🥇", cssClass: "rank-gold" };
      if (rankIndex === 1) return { text: "🥈", cssClass: "rank-silver" };
      if (rankIndex === 2) return { text: "🥉", cssClass: "rank-bronze" };
      return { text: `${rankIndex + 1}`, cssClass: null };
    }

    function renderLeaderboard(filter) {
      state.leaderboardFilter = filter;

      leaderboardFilterTabs.querySelectorAll("button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });

      const records = getRecords();
      const filtered = filter === "모두" ? records : records.filter((r) => r.mode === filter);
      const top = [...filtered].sort((a, b) => b.score - a.score).slice(0, LEADERBOARD_SIZE);

      leaderboardList.innerHTML = "";
      if (top.length === 0) {
        const empty = document.createElement("li");
        empty.className = "leaderboard-empty";
        empty.textContent = "아직 기록이 없어요";
        leaderboardList.appendChild(empty);
        return;
      }

      top.forEach((record, i) => {
        const { text: rankText, cssClass: rankClass } = getRankDisplay(i);

        const li = document.createElement("li");
        li.className = rankClass ? `leaderboard-item ${rankClass}` : "leaderboard-item";

        const topRow = document.createElement("div");
        topRow.className = "lb-top";
        const rank = document.createElement("span");
        rank.className = "lb-rank";
        rank.textContent = rankText;
        const name = document.createElement("span");
        name.className = "lb-name";
        name.textContent = record.nickname;
        const score = document.createElement("span");
        score.className = "lb-score";
        score.textContent = `${record.score}점`;
        topRow.append(rank, name, score);

        const bottomRow = document.createElement("div");
        bottomRow.className = "lb-bottom";
        const modeLine = document.createElement("span");
        modeLine.textContent = record.difficulty ? `${record.mode} (${record.difficulty})` : record.mode;
        const accuracy = document.createElement("span");
        accuracy.textContent = `정답률 ${record.accuracy}%`;
        const date = document.createElement("span");
        date.textContent = record.date.slice(0, 10);
        bottomRow.append(modeLine, accuracy, date);

        li.append(topRow, bottomRow);
        leaderboardList.appendChild(li);
      });
    }

    hintBtn.addEventListener("click", () => useHint(state.list[state.index]));
    nextBtn.addEventListener("click", goNext);
    backBtn.addEventListener("click", () => {
      clearTimeout(state.autoAdvanceTimer);
      clearInterval(state.speedTimerInterval);
      showScreen("mode");
    });
    startBackBtn.addEventListener("click", () => showScreen("mode"));
    difficultyBackBtn.addEventListener("click", () => showScreen(state.mode === "all" ? "mode" : "start"));
    retryBtn.addEventListener("click", retryCurrentMode);
    resultBackBtn.addEventListener("click", () => showScreen("mode"));
    nicknameSaveBtn.addEventListener("click", saveNickname);
    nicknameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") saveNickname();
    });
    leaderboardBtn.addEventListener("click", () => {
      renderLeaderboard(state.leaderboardFilter);
      showScreen("leaderboard");
    });
    leaderboardBackBtn.addEventListener("click", () => showScreen("result"));
    leaderboardRetryBtn.addEventListener("click", () => showScreen("mode"));

    renderModeButtons();
    renderCategoryButtons();
    renderLeaderboardFilterTabs();
  </script>
</body>
</html>
