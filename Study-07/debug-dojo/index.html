<title>디버깅 도장</title>
<style>

  --bg: #f5f4ef; --surface: #ffffff; --surface-2: #eeece5; --text: #1c1b18; --muted: #5d5a52; --line: #dcd9cf;
  --accent: #27458f; --accent-text: #ffffff; --accent-soft: #e5eaf7;
  --seal: #c3402a; --seal-soft: #fbe8e3;
  --ok: #17703d; --ok-soft: #e2f3e8; --bad: #b0281c; --bad-soft: #fcebe9;
  --warn: #7f5300; --warn-soft: #fff3d9;
  --code-bg: #f2f0e9; --code-text: #1c1b18; --gutter: #948f83; --focus: #27458f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --surface: #1c1c1a; --surface-2: #262623; --text: #eeece5; --muted: #a8a498; --line: #35342f;
    --accent: #93acff; --accent-text: #0f1730; --accent-soft: #1f2947;
    --seal: #ff7f63; --seal-soft: #3a1f19;
    --ok: #63d394; --ok-soft: #12301f; --bad: #ff8d84; --bad-soft: #3a1916;
    --warn: #f1c56b; --warn-soft: #33290f;
    --code-bg: #181816; --code-text: #ebe8de; --gutter: #6e6a60; --focus: #93acff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --surface: #1c1c1a; --surface-2: #262623; --text: #eeece5; --muted: #a8a498; --line: #35342f;
  --accent: #93acff; --accent-text: #0f1730; --accent-soft: #1f2947;
  --seal: #ff7f63; --seal-soft: #3a1f19;
  --ok: #63d394; --ok-soft: #12301f; --bad: #ff8d84; --bad-soft: #3a1916;
  --warn: #f1c56b; --warn-soft: #33290f;
  --code-bg: #181816; --code-text: #ebe8de; --gutter: #6e6a60; --focus: #93acff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.6; overflow-wrap: anywhere;
}
code, pre, textarea.code, .mono { font-family: ui-monospace, "D2Coding", "Cascadia Mono", Consolas, Menlo, monospace; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }

/* 맨 위 */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 0 4px; }
.brand a.home { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); min-height: 44px; }

.brand b { font-size: 18px; letter-spacing: -0.01em; }

nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 0 8px; }
nav.tabs a { display: grid; place-items: center; min-height: 44px; border-radius: 10px; text-decoration: none; color: var(--muted);
  font-size: 14px; font-weight: 600; text-align: center; line-height: 1.25; padding: 4px 2px; }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

main { padding: 18px 0 72px; }
h1 { font-size: 25px; line-height: 1.3; margin: 4px 0 6px; letter-spacing: -0.01em; }

p { margin: 8px 0; }

.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }

button, .btn {
  font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); display: inline-flex; align-items: center;
  justify-content: center; gap: 6px; text-decoration: none; line-height: 1.25;
}
button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 9px; border-radius: 999px;

.editor pre.gutter { margin: 0; padding: 12px 8px 12px 10px; text-align: right; color: var(--gutter); user-select: none;

.editor:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.kbd { font-size: 13px; color: var(--muted); }

.tests { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.tests li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }

.summary.ok { color: var(--ok); }
.summary.bad { color: var(--bad); }

.hint { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }

.real { border: 1.5px solid var(--seal); border-radius: 12px; padding: 12px 14px; background: var(--seal-soft); }

details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
pre.prelude { font-size: 13px; background: var(--code-bg); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; }

/* 5단계 */
ol.steps5 { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 10px; }
ol.steps5 > li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 56px; position: relative; }

table { width: 100%; border-collapse: collapse; font-size: 14.5px; }

@media (max-width: 420px) {

<script type="text/plain" data-ex="next-weight" data-part="bug">
// 다음 무게 제안 (노트북 ⑧ next_weight를 JS로 옮긴 것)
// reps: 본 세트들의 횟수,  low~high: 목표 횟수 범위
function nextWeight(weight, reps, low, high, step, rpe) {
  if (weight === 0)
    return { weight: 0, reason: "맨몸 → 횟수 늘리기" };
  if (Math.min(...reps) >= high && rpe === 10)
    return { weight, reason: "다 채웠지만 RPE 10 → 굳히기" };
  if (Math.min(...reps) > high)
    return { weight: weight + step, reason: "증량" };
  if (Math.max(...reps) < low)
    return { weight: Math.max(weight - step, 0), reason: "감량" };
  return { weight, reason: "같은 무게" };
}
</script>

<script type="text/plain" data-ex="parse-set" data-part="bug">
// "60*10*3" → { w: 60, r: 10, count: 3 }
// "60x10"   → { w: 60, r: 10, count: 1 }
// 세트 모양이 아니면 null
function parseSet(token) {
  const parts = token.toLowerCase().replace(/[*×]/g, "x").split("x");
  if (parts.length !== 2 && parts.length !== 3) return null;
  if (!/^\d+(\.\d+)?$/.test(parts[0])) return null;   // 무게: 60, 62.5
  if (!parts.slice(1).every(p => /^\d+$/.test(p))) return null;
  return {
    w: parts[0],
    r: Number(parts[1]),
    count: parts.length === 3 ? Number(parts[2]) : 1,
  };
}

// 다음에 들 무게 = 지난 무게 + 증량 단위
function nextLoad(token, step) {
  return parseSet(token).w + step;
}
</script>

<script type="text/plain" data-ex="json-save" data-part="prelude">
// 테스트용 가짜 localStorage — 진짜처럼 무엇이든 '글자'로 바꿔서 저장해요

<script type="text/plain" data-ex="format-sets" data-part="bug">
// [{w:85,r:8},{w:85,r:8},{w:80,r:10}] → "85*8,8 80*10"
// 앞 세트와 무게가 같으면 횟수만 이어 쓰기
function formatSets(sets) {
  const groups = [];
  for (const s of sets) {
    const last = groups[groups.length];
    if (last && last.w === s.w) last.reps.push(s.r);
    else groups.push({ w: s.w, reps: [s.r] });
  }
  return groups.map(g => `${g.w}*${g.reps.join(",")}`).join(" ");
}
</script>
<script type="text/plain" data-ex="format-sets" data-part="fix">
// [{w:85,r:8},{w:85,r:8},{w:80,r:10}] → "85*8,8 80*10"
// 앞 세트와 무게가 같으면 횟수만 이어 쓰기
function formatSets(sets) {
  const groups = [];
  for (const s of sets) {
    const last = groups[groups.length - 1];
    if (last && last.w === s.w) last.reps.push(s.r);
    else groups.push({ w: s.w, reps: [s.r] });
  }
  return groups.map(g => `${g.w}*${g.reps.join(",")}`).join(" ");
}
</script>

<script type="text/plain" data-ex="streak" data-part="bug">
// 쓴 날짜 목록 → 가장 길게 '연속으로' 쓴 날 수
// dates: ["2026-01-01", "2026-01-02", ...]
function longestStreak(dates) {
  const sorted = [...dates].sort();
  let longest = 0;
  let streak = 0;
  let prev = null;
  for (const date of sorted) {
    const gap = prev ? (Date.parse(date) - Date.parse(prev)) / 86400000 : 0;
    streak = gap === 1 ? streak + 1 : 0;
    longest = Math.max(longest, streak);
    prev = date;
  }
  return longest;
}

<script type="text/plain" data-ex="streak" data-part="fix">

function longestStreak(dates) {
  const sorted = [...dates].sort();
  let longest = 0;
  let streak = 0;
  let prev = null;
  for (const date of sorted) {
    const gap = prev ? (Date.parse(date) - Date.parse(prev)) / 86400000 : 0;
    streak = gap === 1 ? streak + 1 : 1;
    longest = Math.max(longest, streak);
    prev = date;
  }
  return longest;
}

var LEAVE_MIN_HOURS = 40;      // 한 주 이 시간 이상이면 위로휴가 1개
var LEAVE_MAX_PER_PERIOD = 3;  // 기간 전체 최대 3개

function cellHours(value) {
  var codes = !value ? [] : Array.isArray(value) ? value : [value];
  return codes.reduce(function (sum, code) {
    return sum + (SHIFT_HOURS[code] || 0);
  }, 0);
}

// row: 월요일부터 하루 한 칸. 결과: 주별 근무시간 [48, 38, ...]
function weeklyHours(row) {
  var weeks = [];
  for (var w = 0; w < row.length / 7; w++) weeks.push(0);
  row.forEach(function (value, i) {
    weeks[Math.floor(i / 7)] += cellHours(value);
  });
  return weeks;
}

// 40시간 이상인 주마다 1개, 기간 전체 최대 3개
function countLeave(weeks) {
  var earned = weeks.filter(function (h) {
    return h >= LEAVE_MIN_HOURS;
  }).length;
  return Math.min(earned, LEAVE_MAX_PER_PERIOD);
}
</script>

<script type="text/plain" data-ex="meal-sync" data-part="bug">
// 받기: 인터넷의 식사(remote)를 폰 목록(local)에 합치기
//  ① 인터넷에만 있음 → 추가
//  ② 둘 다 있음 → 폰 것이 아직 안 올린 수정(synced: false)이면 폰 것,
//                  이미 올라간 것(synced: true)이면 인터넷 것이 최신
//  ③ 폰에서 올라가 있던 것인데 인터넷에 없음 → 다른 기기에서 지움 → 빼기
function mergeMeals(local, remote) {
  const remoteIds = new Set(remote.map(r => r.id));
  const localIds = new Set(local.map(m => m.id));
  const out = [...local];
  for (const r of remote) {
    if (localIds.has(r.id)) continue;
    out.push({ ...r, synced: true });
  }
  return out.filter(m => !m.synced || remoteIds.has(m.id));
}
</script>
<script type="text/plain" data-ex="meal-sync" data-part="fix">
// 받기: 인터넷의 식사(remote)를 폰 목록(local)에 합치기
//  ① 인터넷에만 있음 → 추가
//  ② 둘 다 있음 → 폰 것이 아직 안 올린 수정(synced: false)이면 폰 것,
//                  이미 올라간 것(synced: true)이면 인터넷 것이 최신
//  ③ 폰에서 올라가 있던 것인데 인터넷에 없음 → 다른 기기에서 지움 → 빼기
function mergeMeals(local, remote) {
  const remoteIds = new Set(remote.map(r => r.id));
  const out = [...local];
  for (const r of remote) {
    const i = out.findIndex(m => m.id === r.id);
    if (i === -1) out.push({ ...r, synced: true });
    else if (out[i].synced) out[i] = { ...r, synced: true };
  }
  return out.filter(m => !m.synced || remoteIds.has(m.id));
}
</script>

// ===================== 값 보여 주기 · 같은지 비교 (워커 안에서도 씀) =====================
function dojoFmt(v, quote, depth) {
  depth = depth || 0;
  if (typeof v === 'string') return quote ? JSON.stringify(v) : v;
  if (v === undefined) return 'undefined';
  if (v === null) return 'null';
  if (typeof v === 'number') return Object.is(v, -0) ? '0' : String(v);
  if (typeof v === 'bigint') return v + 'n';
  if (typeof v === 'function') return 'ƒ ' + (v.name || '(이름 없는 함수)');
  if (typeof v !== 'object') return String(v);
  if (depth > 4) return '…';
  if (v instanceof Date) return isNaN(v) ? 'Invalid Date' : 'Date(' + v.toISOString() + ')';
  if (v instanceof Error) return v.name + ': ' + v.message;
  if (v instanceof RegExp) return String(v);
  if (typeof Promise !== 'undefined' && v instanceof Promise) return 'Promise { … }';
  if (v instanceof Set) return 'Set(' + v.size + ') ' + dojoFmt([...v], true, depth + 1);
  if (v instanceof Map) return 'Map(' + v.size + ') {' + [...v].map(([k, x]) => dojoFmt(k, true, depth + 1) + ' => ' + dojoFmt(x, true, depth + 1)).join(', ') + '}';
  if (Array.isArray(v)) return '[' + v.map(x => dojoFmt(x, true, depth + 1)).join(', ') + ']';
  const keys = Object.keys(v);
  if (!keys.length) return '{}';
  return '{ ' + keys.map(k => (/^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k)) + ': ' + dojoFmt(v[k], true, depth + 1)).join(', ') + ' }';
}
function dojoSame(a, b) {
  if (a === b) return true;
  if (typeof a === 'number' && typeof b === 'number') return a !== a && b !== b;   // NaN끼리는 같다고 봄
  if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return false;
  if (a instanceof Date || b instanceof Date) return a instanceof Date && b instanceof Date && a.getTime() === b.getTime();
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && dojoSame(a[k], b[k]));
}

// ===================== 테스트 돌리기 =====================
// job = { prelude, code, tests: [{ run, expect }] }.  테스트마다 코드를 처음부터 새로 실행해서 서로 영향을 안 줌.
// emit({ type: 'test', i, pass, actual, error, syntax, logs }) · emit({ type: 'log', text }) · emit({ type: 'done' })
// 보안 메모: new Function + eval은 일부러 쓴 것이에요. 이 페이지의 목적이 "내가 고친 코드를 내 브라우저에서 실행"이라서요.
// 코드는 사용자 본인이 쓴 것이고, 인터넷으로 보내지 않으며, 가능하면 페이지와 떨어진 워커(일꾼)에서 돌려요.
async function runSuite(job, emit) {
  let make;
  try {
    make = new Function('console', job.prelude + '\n' + job.code + '\n;return function (__expr) { return eval(__expr); };');
  } catch (err) {
    const msg = (err && err.name ? err.name + ': ' + err.message : String(err));
    job.tests.forEach((t, i) => emit({ type: 'test', i, pass: false, actual: null, error: msg, syntax: true, logs: [] }));
    emit({ type: 'done' });
    return;
  }
  for (let i = 0; i < job.tests.length; i++) {
    const t = job.tests[i];
    const logs = [];
    let sent = false;
    const say = mark => (...args) => {
      const text = (mark ? mark + ' ' : '') + args.map(a => dojoFmt(a, false)).join(' ');
      if (sent) emit({ type: 'log', text: '[테스트 ' + (i + 1) + ' 뒤에 늦게 찍힘] ' + text }); else logs.push(text);
    };
    const con = { log: say(''), info: say(''), debug: say(''), table: say(''), warn: say('⚠️'), error: say('❗') };
    let actual, error = null;
    try {
      const ev = make(con);
      actual = await ev(t.run);
    } catch (err) {
      error = (err && err.name ? err.name + ': ' + err.message : String(err));
    }
    await new Promise(r => setTimeout(r, 5));
    const pass = !error && dojoSame(actual, t.expect);
    sent = true;
    emit({ type: 'test', i, pass, actual: error ? null : dojoFmt(actual, true), error, syntax: false, logs });
  }
  emit({ type: 'done' });
}

let workerURL = null;
let runMode = 'worker';   // 'worker' = 따로 떨어진 일꾼(시간 초과 보호 있음) · 'inline' = 이 페이지 안 (보호 없음)
function newWorker() {
  if (!workerURL) {
    const src = [dojoFmt, dojoSame, runSuite].map(f => f.toString()).join('\n') + `
self.addEventListener('unhandledrejection', e => { e.preventDefault(); const r = e.reason;
  self.postMessage({ type: 'log', text: '❗ 처리 안 된 Promise 에러: ' + (r && r.message ? r.message : String(r)) }); });
self.onmessage = e => { runSuite(e.data, m => self.postMessage(m)); };`;
    workerURL = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  }
  return new Worker(workerURL);
}
window.addEventListener('unhandledrejection', e => {
  if (runMode !== 'inline' || !inlineLate) return;
  e.preventDefault();
  const r = e.reason;
  inlineLate('❗ 처리 안 된 Promise 에러: ' + (r && r.message ? r.message : String(r)));
});
let inlineLate = null;

// 코드 + 문제 → Promise<{ results, allPass, mode }>.  onTest(i, result) · onLate(text)는 화면을 바로바로 고치는 데 씀
function runCode(ex, code, onTest, onLate) {
  const job = { prelude: ex.prelude, code, tests: ex.tests.map(t => ({ run: t.run, expect: t.expect })) };
  return new Promise(resolve => {
    const results = ex.tests.map(() => null);
    let done = false, timer = null, worker = null, heard = false;
    const finish = mode => {
      if (done) return;
      done = true; clearTimeout(timer);
      resolve({ results, allPass: results.every(r => r && r.pass), mode });
      if (worker) { const w = worker; setTimeout(() => w.terminate(), 400); }
    };
    const handle = (m, mode) => {
      heard = true;
      if (m.type === 'test') { results[m.i] = m; if (onTest) onTest(m.i, m); arm(); }
      else if (m.type === 'log') { if (onLate) onLate(m.text); }
      else if (m.type === 'done') finish(mode);
    };
    const arm = () => {
      clearTimeout(timer);
      if (!worker) return;
      timer = setTimeout(() => {
        worker.terminate(); worker = null;
        for (let i = 0; i < results.length; i++) {
          if (results[i]) continue;
          results[i] = { type: 'test', i, pass: false, timeout: true, actual: null, logs: [],
            error: '⏱ ' + (TIME_LIMIT / 1000) + '초 안에 끝나지 않아서 멈췄어요 — 무한 반복일 수 있어요' };
          if (onTest) onTest(i, results[i]);
        }
        finish('worker');
      }, TIME_LIMIT);
    };
    const inline = () => {
      runMode = 'inline';
      worker = null;
      inlineLate = onLate;
      runSuite(job, m => handle(m, 'inline'));
    };
    if (runMode === 'inline' || typeof Worker === 'undefined') return inline();
    try {
      worker = newWorker();
    } catch (e) { return inline(); }
    worker.onmessage = e => handle(e.data, 'worker');
    worker.onerror = e => {
      if (heard) return;
      e.preventDefault();
      try { worker.terminate(); } catch (_) {}
      inline();
    };
    worker.postMessage(job);
    arm();
  });
}

// ===================== 줄 비교 (정답 보기) =====================
function lineDiff(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({ t: ' ', s: a[i], ai: i }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: '-', s: a[i], ai: i }); i++; }
    else { out.push({ t: '+', s: b[j], at: i }); j++; }
  }
  while (i < n) { out.push({ t: '-', s: a[i], ai: i }); i++; }
  while (j < m) { out.push({ t: '+', s: b[j], at: i }); j++; }
  return out;
}
// 고친 곳(버그 코드 기준 줄 번호). 지운 줄이 없으면 "이 줄 앞에 추가"한 줄 번호
function bugLines(ex) {
  const d = lineDiff(ex.bug.split('\n'), ex.fix.split('\n'));
  const removed = d.filter(x => x.t === '-').map(x => x.ai + 1);
  if (removed.length) return { lines: removed, insertOnly: false };
  const added = d.filter(x => x.t === '+').map(x => x.at + 1);
  return { lines: [...new Set(added)], insertOnly: true };
}
function diffHtml(ex) {
  const d = lineDiff(ex.bug.split('\n'), ex.fix.split('\n'));
  const keep = d.map((x, k) => x.t !== ' ' || [-1, 1].some(o => d[k + o] && d[k + o].t !== ' '));
  let html = '', skipped = false;
  d.forEach((x, k) => {
    if (!keep[k]) { if (!skipped) html += '<div class="gap">  …</div>'; skipped = true; return; }
    skipped = false;
    const no = x.t === '+' ? '   ' : String(x.ai + 1).padStart(3, ' ');
    const cls = x.t === '-' ? 'del' : x.t === '+' ? 'add' : '';
    html += `<div class="${cls}">${x.t} ${no}  ${esc(x.s)}</div>`;
  });
  return html;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const s = raw ? JSON.parse(raw) : null;
    if (s && typeof s === 'object') return Object.assign(emptyState(), s);
  } catch (e) { canSave = false; }
  return emptyState();
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); canSave = true; }
  catch (e) { canSave = false; }
}
let state = loadState();

// 폰·PC 시간 기준 "YYYY-MM-DD" (toISOString은 UTC라 쓰지 않아요 — 22번 문제!)
function localDay(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dayBefore(day) {
  const d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() - 1); return localDay(d);
}
function currentStreak() {
  const s = state.streak, today = localDay();
  return s.last === today || s.last === dayBefore(today) ? s.count : 0;
}
function pointsFor(ex) {
  const h = state.hints[ex.id] || 0;
  let p = ex.level * 10 - Math.min(h, 2) * 3;
  if (h >= 3) p = Math.ceil(p / 2);
  return Math.max(p, 2);
}
function markSolved(ex) {
  if (state.solved[ex.id]) return false;
  const today = localDay();
  const pts = pointsFor(ex);
  state.solved[ex.id] = { at: today, points: pts, hints: state.hints[ex.id] || 0, runs: state.runs[ex.id] || 1 };
  state.score += pts;
  const s = state.streak;
  if (s.last !== today) { s.count = s.last === dayBefore(today) ? s.count + 1 : 1; s.last = today; }
  saveState();
  return true;
}
function todayPick() {
  const today = localDay();
  if (state.today && state.today.date === today && byId(state.today.id)) return byId(state.today.id);
  let ex = EXERCISES.find(e => !state.solved[e.id]);
  if (!ex) {   // 다 풀었으면 복습: 날짜로 돌아가며 하나
    const n = Number(today.replace(/-/g, '')) % EXERCISES.length;
    ex = EXERCISES[n];
  }
  state.today = { date: today, id: ex.id };
  saveState();
  return ex;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const srcText = s => `${s.repo}/${s.file}`;
function setTab(name) {

}

}

      <div class="editor">

    </section>

    <section aria-labelledby="h-hints">

    ta.style.height = (n * 21 + 24 + (ta.scrollWidth > ta.clientWidth ? 14 : 0)) + 'px';
  };
  fit();
  let escPressed = false;
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { escPressed = true; return; }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doRun(); return; }
    if (e.key === 'Tab' && !e.shiftKey && !escPressed) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.setRangeText('  ', s, en, 'end');
      ta.dispatchEvent(new Event('input'));
    }
    if (e.key !== 'Escape') escPressed = false;
  });
  ta.addEventListener('input', () => { fit(); state.drafts[id] = ta.value; saveState(); });
  document.getElementById('reset').addEventListener('click', () => {
    if (ta.value !== ex.bug && !confirm('고친 내용을 지우고 처음 버그 코드로 돌릴까요?')) return;

  });

function renderTests(ex, results) {
  const ol = document.getElementById('tests');
  ol.innerHTML = ex.tests.map((t, i) => {
    const r = results && results[i];
    const status = !results ? '' : !r ? 'running' : r.pass ? 'pass' : 'fail';
    const icon = !results ? '◻️' : !r ? '⏳' : r.pass ? '✅' : '❌';
    const actual = !r ? '' : r.error ? `<span>실제</span><code class="mono">${esc(r.error)}</code>` : `<span>실제</span><code class="mono">${esc(r.actual)}</code>`;
    return `<li class="${status === 'running' ? '' : status}" id="test-${i}">
      <div class="head"><span aria-hidden="true">${icon}</span><span>${i + 1}. ${esc(t.name)}</span><span class="sr-only" style="position:absolute;left:-9999px">${status === 'pass' ? '통과' : status === 'fail' ? '실패' : ''}</span></div>
      <code class="call mono">${esc(t.run)}</code>
      <div class="kv"><span>기대</span><code class="mono">${esc(dojoFmt(t.expect, true))}</code>${actual}</div>
    </li>`;
  }).join('');
}

async function doRun() {
  if (!current || current.running) return;
  const ex = current.ex;
  const predText = document.getElementById('pred-text');
  const need = document.getElementById('pred-need');
  if (predText.value.trim().length < 2) {
    need.hidden = false;
    predText.focus();
    return;
  }
  need.hidden = true;
  current.running = true;
  const btn = document.getElementById('run');
  btn.disabled = true; btn.textContent = '실행 중…';
  state.runs[ex.id] = (state.runs[ex.id] || 0) + 1; saveState();
  const code = document.getElementById('code').value;
  const results = ex.tests.map(() => null);
  renderTests(ex, results);
  const conBox = document.getElementById('console');
  const late = [];
  conBox.textContent = '';
  const out = await runCode(ex, code, (i, r) => { results[i] = r; renderTests(ex, results); },
    text => { late.push(text); conBox.textContent += text + '\n'; document.getElementById('con-wrap').open = true; });
  if (!document.body.contains(btn)) return;   // 그사이 다른 화면으로 감
  // 콘솔
  const lines = [];
  out.results.forEach((r, i) => { if (r && r.logs && r.logs.length) r.logs.forEach(l => lines.push(`[테스트 ${i + 1}] ${l}`)); });
  conBox.textContent = (lines.length || late.length) ? lines.concat(late).join('\n') + '\n' : '(찍힌 게 없어요. 궁금한 값이 있으면 코드에 console.log(값)을 넣어 보세요.)';
  if (lines.length || late.length) document.getElementById('con-wrap').open = true;
  if (out.mode === 'inline') conBox.textContent += '\n(이 브라우저에서는 무한 반복 보호 없이 페이지 안에서 실행했어요)';
  // 요약
  const passN = out.results.filter(r => r && r.pass).length;
  const sum = document.getElementById('summary');
  const syntax = out.results.some(r => r && r.syntax);
  const timeout = out.results.some(r => r && r.timeout);
  let firstSolve = false;
  if (out.allPass) {
    firstSolve = markSolved(ex);
    sum.className = 'summary ok';
    sum.textContent = `🎉 ${passN}/${ex.tests.length} 모두 통과!` + (firstSolve ? ` +${state.solved[ex.id].points}점` : '');
  } else {
    sum.className = 'summary bad';
    sum.textContent = syntax ? '문법 에러 — 코드가 한 줄도 실행되지 않았어요. 진짜 페이지라면 화면이 하얘졌을 거예요.'
      : timeout ? `⏱ 시간 초과 — ${passN}/${ex.tests.length} 통과. 끝나지 않는 반복이 있어요.`
      : `${passN}/${ex.tests.length} 통과 — ❌ 테스트의 "기대"와 "실제"를 나란히 보세요.`;
  }
  showCompare(ex, out);
  btn.disabled = false; btn.textContent = '② 다시 실행';
  current.running = false;
  if (firstSolve) renderHints(ex);
}

function showCompare(ex, out) {
  const box = document.getElementById('compare'), body = document.getElementById('compare-body');
  if (!box) return;
  box.hidden = false;
  const pred = state.predictions[ex.id] || {};
  const solved = !!state.solved[ex.id];
  let html = `<p class="small"><b>내 예상:</b> ${pred.text ? esc(pred.text) : '<span class="muted">(비어 있음)</span>'}</p>`;
  if (out) {
    const failed = out.results.map((r, i) => (r && !r.pass ? i + 1 : null)).filter(Boolean);
    html += `<p class="small"><b>실제:</b> ${failed.length ? `테스트 ${failed.join(', ')}번이 틀렸어요.` : '모두 통과했어요.'}</p>`;
  }
  if (solved || (state.hints[ex.id] || 0) >= 3) {
    const bl = bugLines(ex);
    const guess = Number(pred.line);
    const hit = guess && (bl.lines.includes(guess) || (bl.insertOnly && bl.lines.some(l => l - 1 === guess)));
    html += `<p class="small"><b>고칠 곳:</b> 정답은 ${bl.lines.join(', ')}번째 줄${bl.insertOnly ? ' 근처에 한 줄 추가' : ''} · 내 예상 ${guess ? guess + '번째 줄 ' + (hit ? '✅' : '❌') : '(안 적음)'}</p>`;
  }
  html += `<ul class="small" style="padding-left:20px;margin:6px 0">
    <li>예상과 같았나요? 다르면 <b>어느 순간</b>부터 갈렸나요?</li>
    <li>${solved ? '내가 바꾼 건 정확히 몇 군데였나요? 한 군데만 바꿨나요?' : '이번에 바꾼 건 한 군데뿐인가요? 결과가 어떻게 달라졌나요?'}</li>
    <li>이 버그를 처음부터 막으려면 어떤 테스트(경계값)가 있었으면 좋았을까요?</li>
  </ul>`;
  body.innerHTML = html;
}

function renderHints(ex) {
  const level = state.hints[ex.id] || 0;
  const box = document.getElementById('hints'), btns = document.getElementById('hint-btns');
  if (!box) return;
  let html = '';
  if (level >= 1) html += `<div class="hint"><b>힌트 1 · 어디를 볼까</b><br>${esc(ex.hints[0])}</div>`;
  if (level >= 2) html += `<div class="hint"><b>힌트 2 · 무엇이 틀렸나</b><br>${esc(ex.hints[1])}</div>`;
  if (level >= 3 || state.solved[ex.id]) {
    html += `<div class="card"><h3>${level >= 3 ? '정답' : '정답 비교 (푼 문제라 열어 둬요)'}</h3>
      <p class="small muted">빨간 줄(-)이 버그 코드, 초록 줄(+)이 고친 코드예요. 숫자는 버그 코드의 줄 번호.</p>
      <div class="diff mono">${diffHtml(ex)}</div>
      <p>${esc(ex.explain)}</p>
      ${level >= 3 && !state.solved[ex.id] ? '<p class="small muted">정답을 복사하지 말고, 편집기에서 내 손으로 고친 뒤 ② 실행으로 확인해 보세요. (정답을 본 문제는 점수가 반이에요)</p>' : ''}
    </div>`;
  }
  box.innerHTML = html;
  const labels = ['힌트 1 · 어디를 볼까', '힌트 2 · 무엇이 틀렸나', '정답 보기'];
  btns.innerHTML = level < 3 && !state.solved[ex.id] ? `<button type="button" id="next-hint">${labels[level]}</button>` : '';
  const b = document.getElementById('next-hint');
  if (b) b.addEventListener('click', () => {
    if (level === 2 && !confirm('정답을 볼까요? 조금 더 해 보고 싶으면 "취소".')) return;
    state.hints[ex.id] = level + 1; saveState(); renderHints(ex);
    if (level + 1 >= 3) showCompare(ex, null);
  });
}

// ===================== 내 버그 도감 =====================
function dexView() {
  setTab('dex');
  const solved = EXERCISES.filter(e => state.solved[e.id]);
  const cats = Object.keys(CATS);
  const met = cats.filter(c => solved.some(e => e.cat === c));
  const sections = cats.map(c => {
    const items = solved.filter(e => e.cat === c);
    const total = EXERCISES.filter(e => e.cat === c).length;
    if (!total) return '';
    if (!items.length) return `<div class="dexcat"><h3>${esc(CATS[c])} <span class="muted small">— 아직 못 만났어요 (${total}문제)</span></h3></div>`;
    return `<div class="dexcat"><h3>${esc(CATS[c])} <span class="muted small">${items.length}/${total}</span></h3>
      ${items.map(e => `<div class="card dexitem">
        <p style="margin:0"><b>${e.no}. ${esc(e.title)}</b></p>
        <p class="small muted" style="margin:2px 0">${esc(srcText(e.source))} · ${esc(state.solved[e.id].at)} 해결 · ${esc(state.solved[e.id].points)}점</p>
        <label class="f" for="dn-${e.id}">내 말로 한 줄</label>
        <textarea class="plain" id="dn-${e.id}" data-note="${e.id}" placeholder="아직 안 적었어요"></textarea>
        <p style="margin:6px 0 0"><a href="#ex/${e.id}">다시 보기</a></p>
      </div>`).join('')}</div>`;
  }).join('');
  app.innerHTML = `
    ${saveBanner()}
    <h1>내 버그 도감</h1>
    <p class="muted">푼 버그 ${solved.length}개 · 만난 종류 ${met.length}/${cats.length}. "에러가 안 났으니 맞다"가 아니라는 감각을 모으는 곳이에요.</p>
    ${solved.length ? '' : '<div class="card"><p>아직 비어 있어요. <a href="#today">오늘의 1문제</a>를 풀면 여기에 쌓여요.</p></div>'}
    ${sections}

    <h2>직접 만난 진짜 버그 적기</h2>
    <p class="small muted">내 앱에서 버그를 만나면 여기 적어 두세요. 나중에 도장 문제로 만들 재료가 돼요 (Study-07/README.md의 "새 문제 추가하기").</p>
    <div class="card">
      <label class="f" for="mb-where">어디서 (파일 · 화면)</label><input class="plain" id="mb-where" placeholder="예: app/import.js parseDate">
      <label class="f" for="mb-what">증상 (무엇을 했더니 무엇이)</label><textarea class="plain" id="mb-what" placeholder="예: 오전에 오늘 메모를 가져오면 작년으로 들어감"></textarea>
      <label class="f" for="mb-why">원인 · 고친 방법</label><textarea class="plain" id="mb-why" placeholder="예: Date를 시각까지 비교함 → 날짜 글자로 비교"></textarea>
      <div class="row end" style="margin-top:8px"><button class="primary" id="mb-add" type="button">도감에 넣기</button></div>
    </div>
    <div id="mybugs"></div>

    <h2>진행 기록 옮기기</h2>
    <div class="card">
      <p class="small">사지방 PC는 재시작하면 브라우저 기록이 지워질 수 있어요. 끝날 때 아래 글자를 복사해서 노션·메모에 붙여 두고, 다음에 붙여넣고 <b>불러오기</b>를 누르면 이어서 할 수 있어요.</p>
      <textarea class="plain mono" id="backup" style="min-height:110px;font-size:13px" aria-label="진행 기록 글자"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="bk-copy" type="button">복사하기</button>
        <button id="bk-load" type="button">불러오기</button>
        <span class="small muted" id="bk-msg" aria-live="polite"></span>
      </div>
    </div>
  `;
  document.querySelectorAll('textarea[data-note]').forEach(t => {
    t.value = state.notes[t.dataset.note] || '';
    t.addEventListener('input', () => { state.notes[t.dataset.note] = t.value; saveState(); });
  });
  const renderMine = () => {
    const box = document.getElementById('mybugs');
    box.innerHTML = state.myBugs.map((b, k) => `<div class="card"><p style="margin:0"><b data-f="where"></b> <span class="small muted">${esc(b.at)}</span></p>
      <p class="small" style="margin:4px 0" data-f="what"></p><p class="small muted" style="margin:0" data-f="why"></p>
      <div class="row end"><button type="button" data-del="${k}">지우기</button></div></div>`).join('');
    box.querySelectorAll('.card').forEach((card, k) => {
      ['where', 'what', 'why'].forEach(f => { card.querySelector(`[data-f="${f}"]`).textContent = state.myBugs[k][f] || ''; });
    });
    box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('이 기록을 지울까요?')) return;
      state.myBugs.splice(Number(b.dataset.del), 1); saveState(); renderMine();
    }));
  };
  renderMine();
  document.getElementById('mb-add').addEventListener('click', () => {
    const v = id => document.getElementById(id).value.trim();
    if (!v('mb-where') && !v('mb-what')) return;
    state.myBugs.unshift({ where: v('mb-where'), what: v('mb-what'), why: v('mb-why'), at: localDay() });
    saveState();
    ['mb-where', 'mb-what', 'mb-why'].forEach(id => { document.getElementById(id).value = ''; });
    renderMine();
  });
  const bk = document.getElementById('backup'), msg = document.getElementById('bk-msg');
  bk.value = JSON.stringify(state);
  document.getElementById('bk-copy').addEventListener('click', async () => {
    bk.select();
    try { await navigator.clipboard.writeText(bk.value); msg.textContent = '복사했어요.'; }
    catch (e) { try { document.execCommand('copy'); msg.textContent = '복사했어요.'; } catch (_) { msg.textContent = '글자를 직접 선택해서 Ctrl+C 해 주세요.'; } }
  });
  document.getElementById('bk-load').addEventListener('click', () => {
    try {
      const s = JSON.parse(bk.value);
      if (!s || typeof s !== 'object' || typeof s.solved !== 'object') throw new Error('모양');
      if (!confirm('지금 기록을 붙여넣은 기록으로 바꿀까요?')) return;
      state = Object.assign(emptyState(), s); saveState(); dexView(); applyTheme();
      document.getElementById('bk-msg').textContent = '불러왔어요.';
    } catch (e) { msg.textContent = '진행 기록 글자가 아니에요. 복사한 글자 전체를 붙여넣어 주세요.'; }
  });
}

// ===================== 테마 =====================
function applyTheme() {
  const t = state.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme').textContent = t === 'light' ? '☀️ 밝게' : t === 'dark' ? '🌙 어둡게' : '🌓 자동';
}
document.getElementById('theme').addEventListener('click', () => {
  const order = ['auto', 'light', 'dark'];
  state.theme = order[(order.indexOf(state.theme || 'auto') + 1) % 3];
  saveState(); applyTheme();
});

// ===================== 주소(#)로 화면 고르기 =====================
function route() {
  const h = location.hash || '#home';
  current = null;
  if (h.startsWith('#ex/')) exView(decodeURIComponent(h.slice(4)), false);
  else if (h === '#today') exView(todayPick().id, true);
  else if (h === '#steps') stepsView();
  else if (h === '#dex') dexView();
  else homeView();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
applyTheme();
route();

// 확인용 (verify.mjs가 씀): 문제마다 버그 코드/정답 코드를 실제 실행기로 돌려 봄
window.dojo = {
  exercises: EXERCISES,
  get mode() { return runMode; },
  async check(id, which) {
    const ex = byId(id);
    const out = await runCode(ex, which === 'fix' ? ex.fix : ex.bug);
    return { id, which, allPass: out.allPass, mode: out.mode,
      results: out.results.map(r => ({ pass: !!(r && r.pass), actual: r && r.actual, error: r && r.error, timeout: !!(r && r.timeout) })) };
  },
  bugLines: id => bugLines(byId(id)),
};
</script>
